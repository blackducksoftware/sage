[tool.poetry]
name = "sage"
version = "2.3.1"
description = "Analyze usage of a Black Duck system and offer sage advice for how to improve usage"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "sage"}]

[tool.poetry.dependencies]
python = "^3.8"
blackduck = ">=1.0.2"
python-dateutil = ">=2.8.0"
requests = ">=2.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
requests-mock = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

